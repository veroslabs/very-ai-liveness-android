plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Release signing for a distributed demo APK. Credentials come from the
// DEMO_KEYSTORE_PATH / DEMO_KEYSTORE_PASSWORD / DEMO_KEY_ALIAS /
// DEMO_KEY_PASSWORD environment variables so no keystore lands in git. When
// they are absent the release build falls back to the debug key, which keeps a
// local `assembleRelease` working — such an APK is for local use only, as it
// will not upgrade over a properly signed install.
def demoKeystore = System.getenv("DEMO_KEYSTORE_PATH")
def hasDemoKeystore = demoKeystore != null && file(demoKeystore).exists()

android {
    namespace 'org.very.liveness.example'
    compileSdk 34

    defaultConfig {
        applicationId "org.very.liveness.example"
        minSdk 23
        targetSdk 34
        // -PdemoVersionCode / -PdemoVersionName override these, so
        // distributed builds always move forward.
        versionCode ((project.findProperty("demoVersionCode") ?: 1) as Integer)
        versionName (project.findProperty("demoVersionName") ?: "1.0.0")
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    signingConfigs {
        demo {
            if (hasDemoKeystore) {
                storeFile file(demoKeystore)
                storePassword System.getenv("DEMO_KEYSTORE_PASSWORD")
                keyAlias System.getenv("DEMO_KEY_ALIAS") ?: "demo"
                keyPassword System.getenv("DEMO_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            signingConfig hasDemoKeystore ? signingConfigs.demo : signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        // Debug-signed, installable APK that runs the host app through R8
        // full mode (AGP 8 default), the way a minified production app
        // consumes the SDK: `installMinified` on the app module. Kept off
        // `debug` so normal debug builds stay unminified.
        minified {
            initWith debug
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            matchingFallbacks = ['debug']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'

    implementation 'org.very:liveness:1.1.0'

    // Force CameraX 1.4.1 for 16 KB aligned native libs.
    def camerax_version = "1.4.1"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"
}
